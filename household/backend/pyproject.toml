[project]
name = "household-backend"
version = "0.1.0"
description = "Chore/points/task scheduling service"
requires-python = ">=3.12"
dependencies = [
    "shared",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.30",
    "reportlab>=4.2",
    "pywebpush>=2.0",
    "apscheduler>=3.10",
    "python-multipart>=0.0.12",
]

[tool.uv.sources]
shared = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/household_service"]
