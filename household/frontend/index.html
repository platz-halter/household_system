<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#ffffff" />
  <title>Household System — Household</title>
  <link rel="manifest" href="/manifest.json" />
  <link rel="icon" href="/icons/icon-512.png" />
  <!-- iOS ignores the manifest's icons entirely — needs its own explicit
       link, plus this meta pair, to behave like an installed app instead
       of just a bookmarked Safari tab. -->
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Household" />
  <link rel="stylesheet" href="/css/tokens.css" />
  <link rel="stylesheet" href="/css/base.css" />
  <link rel="stylesheet" href="/css/components.css" />
  <script>
    // Apply the stored theme before first paint, so there's no flash of
    // the default theme on load.
    (function () {
      var t = localStorage.getItem("hs-theme") || "light";
      document.documentElement.setAttribute("data-theme", t);
    })();
  </script>
</head>
<body>
  <header class="topbar" id="topbar">
    <h1>Household</h1>
    <div class="row" style="gap: var(--space-2);">
      <button class="btn btn-icon btn-ghost" id="notif-bell" aria-label="Notifications" title="Notifications" hidden>
        <svg class="icon" viewBox="0 0 24 24"><path d="M6 10a6 6 0 0 1 12 0c0 3.2 1 5 2 6H4c1-1 2-2.8 2-6Z"/><path d="M9.5 19a2.5 2.5 0 0 0 5 0"/></svg>
        <span id="notif-badge" class="notif-badge" hidden></span>
      </button>
      <a href="/settings" class="btn btn-icon btn-ghost" data-route="settings" aria-label="Settings" title="Settings">
        <svg class="icon" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .34 1.87l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.7 1.7 0 0 0-1.87-.34 1.7 1.7 0 0 0-1 1.55V21a2 2 0 1 1-4 0v-.09a1.7 1.7 0 0 0-1-1.55 1.7 1.7 0 0 0-1.87.34l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.7 1.7 0 0 0 4.6 15a1.7 1.7 0 0 0-1.55-1H3a2 2 0 1 1 0-4h.09A1.7 1.7 0 0 0 4.6 9a1.7 1.7 0 0 0-.34-1.87l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.7 1.7 0 0 0 9 4.6a1.7 1.7 0 0 0 1-1.55V3a2 2 0 1 1 4 0v.09a1.7 1.7 0 0 0 1 1.55 1.7 1.7 0 0 0 1.87-.34l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.7 1.7 0 0 0 19.4 9a1.7 1.7 0 0 0 1.55 1H21a2 2 0 1 1 0 4h-.09a1.7 1.7 0 0 0-1.51 1Z"/></svg>
      </a>
    </div>
  </header>

  <main id="app"></main>

  <nav class="bottom-nav" id="bottom-nav">
    <a href="/home" data-route="home">
      <svg class="icon" viewBox="0 0 24 24"><path d="m3 11 9-8 9 8"/><path d="M5 10v10h14V10"/><path d="M9 20v-6h6v6"/></svg>
      <span>Home</span>
    </a>
    <a href="/board" data-route="board">
      <svg class="icon" viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="17" rx="2"/><path d="M9 3h6v4H9zM8 11h8M8 15h5"/></svg>
      <span>Board</span>
    </a>
    <a href="/stats" data-route="stats">
      <svg class="icon" viewBox="0 0 24 24"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>
      <span>Stats</span>
    </a>
    <a href="/tasks" data-route="tasks">
      <svg class="icon" viewBox="0 0 24 24"><path d="M20 10 13 3H4v9l7 7 9-9Z"/><circle cx="8.5" cy="7.5" r="1.2"/></svg>
      <span>Tasks</span>
    </a>
  </nav>

  <div id="toast-root"></div>

  <script type="module" src="/js/main.js"></script>
</body>
</html>
