server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Docker's embedded DNS (always 127.0.0.11) — needed so the proxy
    # blocks below re-resolve their backend's hostname per request
    # instead of caching whatever IP it had at nginx's own startup. A
    # *literal* hostname in proxy_pass (no variable) only resolves ONCE,
    # at config load — if that backend container is later recreated
    # (redeploy, image update, a crash Docker restarts) and comes back
    # with a different IP, as Compose's default bridge network commonly
    # does, this container would otherwise 502 on every request forever,
    # until something restarts THIS container too, even though the
    # backend itself is healthy and reachable. Confirmed live (same test
    # against storage/frontend's identical setup) — see its nginx.conf
    # for the repro — until these blocks were changed to resolve
    # dynamically via a variable (see below).
    resolver 127.0.0.11 valid=10s;

    # Proxies /api/auth and /api/household to their containers on the
    # same Compose network, stripping the prefix via the explicit
    # rewrite below (the automatic proxy_pass prefix-stripping only
    # applies to a literal URL — using a variable, needed for the
    # dynamic resolve above, turns that off, so it's done explicitly
    # instead). This means the *external* reverse proxy (Caddy, etc.)
    # only needs a single catch-all rule pointed at this container
    # instead of one handle block per backend.
    # ^~ matters here: without it, nginx still picks this as the longest
    # matching prefix but then lets a regex location (the css/js/image
    # blocks below) win anyway if the request path happens to end in one
    # of those extensions — ^~ makes a prefix match final, skipping the
    # regex check entirely. No current API route ends in .js/.png/etc, so
    # this isn't live-reproducible today, but it's one route away from a
    # request silently 404ing as a "static file" instead of reaching the
    # backend, so it's written defensively now rather than after the fact.
    location ^~ /api/auth/ {
        # `set` must come before `rewrite ... break` — break halts every
        # later rewrite-module directive in this location (set included),
        # so writing them the other way leaves $auth_upstream
        # uninitialized and every request 500s ("using uninitialized
        # variable"). Caught live by the same force-recreate test noted
        # above.
        set $auth_upstream http://auth:8000;
        rewrite ^/api/auth/(.*)$ /$1 break;
        proxy_pass $auth_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ^~ /api/household/ {
        set $household_upstream http://household-backend:8000;
        rewrite ^/api/household/(.*)$ /$1 break;
        proxy_pass $household_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # The service worker must never be long-cached — browsers need to see
    # an update promptly, since it's what makes push notifications work at
    # all. Exact match (=) beats the general static-asset rule below.
    location = /sw.js {
        add_header Cache-Control "no-cache";
    }

    # index.html and manifest.json used to fall all the way through to
    # the generic `location /` block below with NO Cache-Control header
    # at all — unlike every other static asset here, which explicitly
    # says either "revalidate every time" (css/js) or "cache hard"
    # (images). No header means nginx's bare defaults (Last-Modified
    # only, no explicit freshness lifetime), which left it up to each
    # client's own HEURISTIC caching — and Android's WebAPK shell for
    # an INSTALLED app is known to cache its entry HTML and manifest
    # far more aggressively/unpredictably under exactly that condition
    # than a normal browser tab does, which is consistent with every
    # theme/manifest-color fix this round landing on the server but
    # never visibly reaching the installed app, however many times it
    # was rebuilt, reinstalled, or its own OS-level cache was cleared —
    # none of that forces the WebAPK to actually re-check an entry
    # point it was never told could go stale in the first place.
    # try_files's internal redirect to /index.html (the SPA fallback
    # below) re-enters location matching, so this exact-match block
    # still applies to every client-side route, not just a literal "/".
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location = /manifest.json {
        add_header Cache-Control "no-cache";
    }

    # JS/CSS — no build-hash in filenames (deliberate, no-build-step
    # setup), so a long cache here would let a browser keep serving a
    # stale file for days after a real deploy, with no way to force it
    # to refresh. `no-cache` still lets the browser cache the file, it
    # just revalidates with the server on every load; nginx sends an
    # ETag/Last-Modified by default, so an unchanged file still comes
    # back as a cheap 304 rather than a full re-download.
    location ~* \.(?:css|js)$ {
        add_header Cache-Control "no-cache";
    }

    # Images rarely change once uploaded/deployed — safe to cache hard.
    location ~* \.(?:svg|png|jpg|jpeg|webp)$ {
        expires 7d;
        add_header Cache-Control "public";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
