server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # The service worker must never be long-cached — browsers need to see
    # an update promptly, since it's what makes push notifications work at
    # all. Exact match (=) beats the general static-asset rule below.
    location = /sw.js {
        add_header Cache-Control "no-cache";
    }

    # Static assets — long cache, since filenames don't change on deploy
    # (no build hash in this no-build-step setup; bump manually if you
    # ever need to force-bust a cached JS file after a deploy).
    location ~* \.(?:css|js|svg|png|jpg|jpeg|webp)$ {
        expires 7d;
        add_header Cache-Control "public";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
