[project]
name = "shared"
version = "1.0.4"
description = "Shared config, DB session, and auth-verification code for all Household System services"
requires-python = ">=3.12"
dependencies = [
    "pydantic-settings>=2.6",
    "sqlalchemy[asyncio]>=2.0",
    "python-jose[cryptography]>=3.3",
    "httpx>=0.27",
    "alembic>=1.13",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/shared"]
