server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Docker's embedded DNS (always 127.0.0.11) — needed so the proxy
    # blocks below re-resolve their backend's hostname per request
    # instead of caching whatever IP it had at nginx's own startup. A
    # *literal* hostname in proxy_pass (no variable) only resolves ONCE,
    # at config load — if that backend container is later recreated
    # (redeploy, image update, a crash Docker restarts) and comes back
    # with a different IP, as Compose's default bridge network commonly
    # does, this container would otherwise 502 on every request forever,
    # until something restarts THIS container too, even though the
    # backend itself is healthy and reachable. Confirmed live: a
    # `docker compose up -d --force-recreate storage-backend` reliably
    # reproduced exactly that — reachable fine by IP/host-port, 502 by
    # name — until these blocks were changed to resolve dynamically via
    # a variable (see below).
    resolver 127.0.0.11 valid=10s;

    # Proxies /api/auth and /api/storage to their containers on the same
    # Compose network, stripping the prefix via the explicit rewrite
    # below (the automatic proxy_pass prefix-stripping only applies to a
    # literal URL — using a variable, needed for the dynamic resolve
    # above, turns that off, so it's done explicitly instead). This
    # means the *external* reverse proxy (Caddy, etc.) only needs a
    # single catch-all rule pointed at this container — see
    # storage/frontend/README.md — instead of one handle block per
    # backend. js/config.js already defaults to these same-origin paths
    # in its "production" lines; only local dev needs the alternate
    # 127.0.0.1:PORT config.
    # ^~ matters here: without it, nginx still picks this as the longest
    # matching prefix but then lets a regex location (the css/js/image
    # blocks below) win anyway if the request path happens to end in one
    # of those extensions — ^~ makes a prefix match final, skipping the
    # regex check entirely. No current API route ends in .js/.png/etc, so
    # this isn't live-reproducible today, but it's one route away from a
    # request silently 404ing as a "static file" instead of reaching the
    # backend, so it's written defensively now rather than after the fact.
    location ^~ /api/auth/ {
        # `set` must come before `rewrite ... break` — break halts every
        # later rewrite-module directive in this location (set included),
        # so writing them the other way leaves $auth_upstream
        # uninitialized and every request 500s ("using uninitialized
        # variable"). Caught live by the same force-recreate test noted
        # above.
        set $auth_upstream http://auth:8000;
        rewrite ^/api/auth/(.*)$ /$1 break;
        proxy_pass $auth_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ^~ /api/storage/ {
        set $storage_upstream http://storage-backend:8000;
        rewrite ^/api/storage/(.*)$ /$1 break;
        proxy_pass $storage_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Item photos can be a few MB; the defaults are fine for this
        # app's scale, but raise this first if a large upload ever 413s.
        client_max_body_size 10m;
    }

    # JS/CSS — no build-hash in filenames (deliberate, no-build-step
    # setup), so a long cache here would let a browser keep serving a
    # stale file for days after a real deploy, with no way to force it
    # to refresh. `no-cache` still lets the browser cache the file, it
    # just revalidates with the server on every load; nginx sends an
    # ETag/Last-Modified by default, so an unchanged file still comes
    # back as a cheap 304 rather than a full re-download.
    location ~* \.(?:css|js)$ {
        add_header Cache-Control "no-cache";
    }

    # Images rarely change once uploaded/deployed — safe to cache hard.
    location ~* \.(?:svg|png|jpg|jpeg|webp)$ {
        expires 7d;
        add_header Cache-Control "public";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
