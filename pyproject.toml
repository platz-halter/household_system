[project]
name = "household-system"
version = "0.1.0"
description = "Household Management System V2 — workspace root"
requires-python = ">=3.12"
dependencies = []

[tool.uv.workspace]
members = [
    "shared",
    "auth",
    "household/backend",
    "storage/backend",
]

[tool.uv.sources]
shared = { workspace = true }

[dependency-groups]
dev = [
    "ruff>=0.7",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
]
